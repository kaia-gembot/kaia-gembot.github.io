<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" style="background:#070a12; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
<defs>

  <radialGradient id="bgGlow" cx="45%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#080c16" stop-opacity="0.98"/>
    <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
  </radialGradient>
  
  <linearGradient id="metalSteel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#475569"/>
    <stop offset="30%" stop-color="#64748b"/>
    <stop offset="70%" stop-color="#334155"/>
    <stop offset="100%" stop-color="#1e293b"/>
  </linearGradient>

  <linearGradient id="magnetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1e293b"/>
    <stop offset="25%" stop-color="#334155"/>
    <stop offset="70%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="copperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fed7aa"/>
    <stop offset="25%" stop-color="#f97316"/>
    <stop offset="70%" stop-color="#ea580c"/>
    <stop offset="100%" stop-color="#9a3412"/>
  </linearGradient>

  <linearGradient id="conePaper" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#334155"/>
    <stop offset="30%" stop-color="#64748b"/>
    <stop offset="70%" stop-color="#475569"/>
    <stop offset="100%" stop-color="#1e293b"/>
  </linearGradient>

  <linearGradient id="dustCapGrad" x1="30%" y1="30%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="50%" stop-color="#334155"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>

  <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>

  <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
  </linearGradient>

  <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Technical Grid Pattern -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172033" stroke-width="0.75" stroke-dasharray="2,2"/>
  </pattern>

</defs>
<rect width="800" height="800" fill="url(#bgGlow)"/>
<rect width="800" height="800" fill="url(#gridPattern)" opacity="0.6"/>

  <!-- Outer Technical Border Frame -->
  <rect x="24" y="24" width="752" height="752" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="#0f172a" stroke-width="0.5"/>

  <!-- Corner Registration Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.6">
    <path d="M 20 24 L 34 24 M 24 20 L 24 34"/>
    <path d="M 766 24 L 780 24 M 776 20 L 776 34"/>
    <path d="M 20 776 L 34 776 M 24 766 L 24 780"/>
    <path d="M 766 776 L 780 776 M 776 766 L 776 780"/>
  </g>


  <!-- Technical Title Block -->
  <g id="headerBlock">
    <text x="50" y="58" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.25em">THE INERTIA OF THE CONE</text>
    <text x="50" y="76" fill="#94a3b8" font-size="10.5" letter-spacing="0.08em">MECHANICAL LOW-PASS FILTERING &amp; 1-BIT PWM ACOUSTIC RECONSTRUCTION</text>
    <text x="50" y="94" fill="#38bdf8" font-size="9" opacity="0.85">ZX SPECTRUM PORT $FE (BIT 4) ➔ LORENTZ COIL ➔ PAPER DIAPHRAGM MASS ➔ AIR ACOUSTIC INTERACTION</text>

    <!-- Header Meta Badges -->
    <g transform="translate(540, 48)">
      <rect x="0" y="0" width="206" height="48" rx="4" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="18" fill="#64748b" font-size="8.5">GOVERNING RISE CONSTANT</text>
      <text x="12" y="34" fill="#fbbf24" font-size="12" font-weight="700">τ = 97 — 170 μs</text>
      <text x="130" y="34" fill="#38bdf8" font-size="10" font-weight="600">fc ≈ 1.2 kHz</text>
    </g>
  </g>


  <!-- MAIN SCHEMATIC: Moving-Coil Speaker Cross-Section & Field Lines -->
  <g id="speakerCrossSection">
    
    <!-- Coordinate Axis / Centerline -->
    <line x1="80" y1="320" x2="740" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="8,4,2,4" opacity="0.6"/>
    <text x="700" y="315" fill="#475569" font-size="8" text-anchor="end">AXIS OF DISPLACEMENT (x)</text>

    <!-- Magnetic Field Lines (Gold Dashed Loops through Gap) -->
    <g stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3" fill="none" opacity="0.6" filter="url(#glowAmber)">
      <!-- Top Loop -->
      <path d="M 210 240 C 210 180, 270 180, 270 260 C 270 295, 230 295, 210 240"/>
      <!-- Bottom Loop -->
      <path d="M 210 400 C 210 460, 270 460, 270 380 C 270 345, 230 345, 210 400"/>
      <!-- Linear Gap Flux Vectors -->
      <line x1="250" y1="270" x2="270" y2="270" stroke-width="2" stroke-dasharray="none"/>
      <line x1="250" y1="280" x2="270" y2="280" stroke-width="2" stroke-dasharray="none"/>
      <line x1="250" y1="360" x2="270" y2="360" stroke-width="2" stroke-dasharray="none"/>
      <line x1="250" y1="370" x2="270" y2="370" stroke-width="2" stroke-dasharray="none"/>
    </g>

    <!-- Steel Backplate & Central Pole Piece -->
    <!-- Top & Bottom Iron Yoke Plates -->
    <path d="M 120 220 L 220 220 L 220 250 L 150 250 L 150 390 L 220 390 L 220 420 L 120 420 Z" 
          fill="url(#metalSteel)" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Central Pole Piece (Cylindrical Core extending through magnet center) -->
    <rect x="150" y="285" width="105" height="70" rx="2" fill="url(#metalSteel)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Permanent Ceramic Ferrite Magnet Rings (Top & Bottom) -->
    <!-- Top Magnet -->
    <rect x="150" y="235" width="70" height="45" rx="1" fill="url(#magnetGrad)" stroke="#475569" stroke-width="1.2"/>
    <text x="185" y="262" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">MAG [N]</text>

    <!-- Bottom Magnet -->
    <rect x="150" y="360" width="70" height="45" rx="1" fill="url(#magnetGrad)" stroke="#475569" stroke-width="1.2"/>
    <text x="185" y="387" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">MAG [S]</text>

    <!-- Top Front Plate (Concentrates Flux into air gap) -->
    <rect x="220" y="235" width="30" height="45" fill="url(#metalSteel)" stroke="#64748b" stroke-width="1"/>
    <!-- Bottom Front Plate -->
    <rect x="220" y="360" width="30" height="45" fill="url(#metalSteel)" stroke="#64748b" stroke-width="1"/>

    <!-- The Annular Air Gap (Between Pole Piece X=255 and Front Plate X=250) -->
    <!-- The Voice Coil Former (Kapton / Paper cylinder sliding in gap) -->
    <rect x="250" y="272" width="55" height="4" fill="#fbbf24" stroke="#d97706" stroke-width="0.75"/>
    <rect x="250" y="364" width="55" height="4" fill="#fbbf24" stroke="#d97706" stroke-width="0.75"/>
    <line x1="305" y1="274" x2="305" y2="366" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Enameled Copper Wire Windings (The Moving Voice Coil) -->
    <g fill="url(#copperGrad)" stroke="#b45309" stroke-width="0.5">
      <!-- Top Coil Windings -->
      <rect x="252" y="267" width="5" height="14" rx="1"/>
      <rect x="259" y="267" width="5" height="14" rx="1"/>
      <rect x="266" y="267" width="5" height="14" rx="1"/>
      <rect x="273" y="267" width="5" height="14" rx="1"/>
      <rect x="280" y="267" width="5" height="14" rx="1"/>
      <rect x="287" y="267" width="5" height="14" rx="1"/>

      <!-- Bottom Coil Windings -->
      <rect x="252" y="359" width="5" height="14" rx="1"/>
      <rect x="259" y="359" width="5" height="14" rx="1"/>
      <rect x="266" y="359" width="5" height="14" rx="1"/>
      <rect x="273" y="359" width="5" height="14" rx="1"/>
      <rect x="280" y="359" width="5" height="14" rx="1"/>
      <rect x="287" y="359" width="5" height="14" rx="1"/>
    </g>

    <!-- Corrugated Spider Suspension (Phenolic Accordion Bellows) -->
    <!-- Top Spider -->
    <path d="M 305 274 Q 312 250, 318 262 T 328 262 T 338 250 L 340 240" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="340" cy="240" r="3" fill="#f59e0b"/>

    <!-- Bottom Spider -->
    <path d="M 305 366 Q 312 390, 318 378 T 328 378 T 338 390 L 340 400" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="340" cy="400" r="3" fill="#f59e0b"/>

    <!-- Central Convex Dust Cap (Spherical Dome covering apex) -->
    <path d="M 305 274 A 50 50 0 0 1 305 366 Z" fill="url(#dustCapGrad)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Conical Paper Diaphragm (Upper & Lower Walls) -->
    <!-- Upper Cone Wall: from (305, 274) out to outer rim (480, 140) -->
    <path d="M 305 274 C 340 260, 420 180, 480 140 L 485 145 C 425 185, 345 265, 305 278 Z" 
          fill="url(#conePaper)" stroke="#94a3b8" stroke-width="1.2"/>
    
    <!-- Lower Cone Wall: from (305, 366) out to outer rim (480, 500) -->
    <path d="M 305 366 C 340 380, 420 460, 480 500 L 485 495 C 425 455, 345 375, 305 362 Z" 
          fill="url(#conePaper)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Diaphragm Surface Concentric Ribs (Stiffening grooves in paper) -->
    <path d="M 360 236 C 375 230, 390 230, 400 240" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 360 404 C 375 410, 390 410, 400 400" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 420 190 C 435 185, 450 185, 460 195" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 420 450 C 435 455, 450 455, 460 445" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Outer Surround (Corrugated Roll attached to basket) -->
    <!-- Top Surround -->
    <path d="M 480 140 C 485 125, 505 125, 510 140 L 525 140" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <rect x="522" y="136" width="10" height="8" rx="1" fill="#334155" stroke="#64748b"/>

    <!-- Bottom Surround -->
    <path d="M 480 500 C 485 515, 505 515, 510 500 L 525 500" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <rect x="522" y="496" width="10" height="8" rx="1" fill="#334155" stroke="#64748b"/>

    <!-- Rigid Outer Chassis / Basket Legs -->
    <path d="M 525 144 L 460 180 L 340 240 M 525 496 L 460 460 L 340 400" 
          fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Callout Dimensions & Arrows -->
    <!-- Coil Force Vector F = B * l * i -->
    <g transform="translate(290, 320)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowRed)" filter="url(#glowAmber)"/>
      <text x="42" y="4" fill="#f43f5e" font-size="9" font-weight="700">F = B·ℓ·i</text>
    </g>

    <!-- Callout Text Labels -->
    <g font-size="8.5" fill="#94a3b8">
      <!-- Pole piece label -->
      <line x1="160" y1="300" x2="110" y2="280" stroke="#475569" stroke-width="0.8"/>
      <text x="105" y="278" text-anchor="end">CENTRAL POLE PIECE</text>

      <!-- Voice coil label -->
      <line x1="270" y1="265" x2="250" y2="180" stroke="#f97316" stroke-width="0.8"/>
      <text x="245" y="178" fill="#f97316" font-weight="600" text-anchor="end">VOICE COIL BOBBIN</text>
      <text x="245" y="188" fill="#64748b" font-size="7.5" text-anchor="end">(0.12mm COPPER, 8Ω)</text>

      <!-- Spider label -->
      <line x1="325" y1="258" x2="330" y2="200" stroke="#d97706" stroke-width="0.8"/>
      <text x="330" y="196" fill="#d97706" font-weight="600">SUSPENSION SPIDER (k)</text>

      <!-- Cone label -->
      <line x1="430" y1="200" x2="460" y2="105" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="465" y="102" fill="#f8fafc" font-weight="600">PRESSED PAPER CONE (m ≈ 1.8g)</text>
      <text x="465" y="112" fill="#64748b" font-size="7.5">MECHANICAL LOW-PASS DIAPHRAGM</text>
    </g>

    <!-- Radiating Acoustic Wavefronts (Emitted Pressure in Air) -->
    <!-- Concentric smooth curved arcs radiating from cone perimeter into space -->
    <g stroke="url(#pulseGrad)" fill="none" opacity="0.75" filter="url(#glowCyan)">
      <path d="M 490 200 C 530 240, 530 400, 490 440" stroke-width="1.5"/>
      <path d="M 525 170 C 585 220, 585 420, 525 470" stroke-width="2"/>
      <path d="M 565 140 C 645 200, 645 440, 565 500" stroke-width="2.5"/>
      <path d="M 610 110 C 710 180, 710 460, 610 530" stroke-width="2"/>
      <path d="M 660 80  C 780 160, 780 480, 660 560" stroke-width="1.5" stroke-dasharray="6,3"/>
      <path d="M 715 50  C 850 140, 850 500, 715 590" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
    </g>
    <text x="635" y="270" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="0.1em">p(r, t)</text>
    <text x="635" y="285" fill="#64748b" font-size="8">ANALOG PRESSURE WAVE</text>
    <text x="635" y="296" fill="#0284c7" font-size="7.5">CARRIER HARMONICS DAMPED</text>
  </g>


  <!-- DUAL-TRACE WAVEFORM RECONSTRUCTION HARNESS -->
  <g id="oscilloscopeBlock" transform="translate(50, 560)">
    <!-- Chassis Background -->
    <rect x="0" y="0" width="700" height="190" rx="6" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Title / Scope Header -->
    <rect x="0" y="0" width="700" height="26" rx="4" fill="#0f172a"/>
    <text x="14" y="17" fill="#f8fafc" font-size="9.5" font-weight="700" letter-spacing="0.12em">PHYSICAL TRANSDUCTION OSCILLOGRAM: ELECTRICAL INPUT vs MECHANICAL POSITION</text>
    <text x="686" y="17" fill="#64748b" font-size="8.5" text-anchor="end">TIMEBASE: 50 μs / DIV  ·  FS = 8.0 kHz</text>

    <!-- Channel 1: Binary 1-Bit Gate Pulse (Top Sub-Trace) -->
    <!-- Y Baseline: 75 -->
    <g id="channel1">
      <!-- Axis Lines -->
      <line x1="20" y1="75" x2="680" y2="75" stroke="#1e293b" stroke-width="0.8"/>
      <line x1="20" y1="45" x2="680" y2="45" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2,4"/>
      
      <!-- Channel Label -->
      <text x="24" y="42" fill="#38bdf8" font-size="9" font-weight="700">CH1: PORT $FE BIT 4 [ACTUATOR VOLTAGE]</text>
      <text x="240" y="42" fill="#64748b" font-size="8">(DISCRETE BINARY PULSES: 0V vs 5V)</text>

      <!-- Digital Square Waves with Variable Width (PWM synthesis) -->
      <!-- 5 pulses with varying duty cycle representing 4-bit sample levels -->
      <path d="
        M 100 75 L 120 75 L 120 45 L 138 45 L 138 75 
        L 210 75 L 210 45 L 236 45 L 236 75 
        L 310 75 L 310 45 L 348 45 L 348 75 
        L 420 75 L 420 45 L 470 45 L 470 75 
        L 540 75 L 540 45 L 610 45 L 610 75 
        L 660 75" 
        fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>

      <!-- Pulse Width Annotation -->
      <g font-size="7.5" fill="#38bdf8" opacity="0.9">
        <line x1="310" y1="40" x2="348" y2="40" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="329" y="36" text-anchor="middle">Δt_pulse = 29+4i</text>
      </g>
    </g>

    <!-- Channel 2: Physical Cone Position x(t) (Bottom Sub-Trace) -->
    <!-- Y Baseline: 155 -->
    <g id="channel2">
      <!-- Axis Lines -->
      <line x1="20" y1="155" x2="680" y2="155" stroke="#1e293b" stroke-width="0.8"/>
      <line x1="20" y1="105" x2="680" y2="105" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2,4"/>

      <!-- Channel Label -->
      <text x="24" y="102" fill="#fbbf24" font-size="9" font-weight="700">CH2: DIAPHRAGM DISPLACEMENT x(t)</text>
      <text x="235" y="102" fill="#64748b" font-size="8">(EXPONENTIAL RISE x = X_max(1 - e^-t/τ) ➔ ANALOG SYNTHESIS)</text>

      <!-- Filtered Smooth Analog Waveform showing mechanical inertia smoothing -->
      <path d="
        M 100 155 
        C 120 155, 125 146, 138 145 C 150 144, 170 154, 210 155
        C 215 155, 222 135, 236 134 C 255 133, 275 154, 310 155
        C 318 155, 330 120, 348 118 C 370 116, 390 153, 420 155
        C 430 155, 450 110, 470 108 C 495 106, 515 152, 540 155
        C 555 155, 580 98,  610 96  C 635 94,  650 152, 660 155"
        fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#glowAmber)"/>

      <!-- Mechanical Shading Area showing analog volume integral -->
      <path d="
        M 100 155 
        C 120 155, 125 146, 138 145 C 150 144, 170 154, 210 155
        C 215 155, 222 135, 236 134 C 255 133, 275 154, 310 155
        C 318 155, 330 120, 348 118 C 370 116, 390 153, 420 155
        C 430 155, 450 110, 470 108 C 495 106, 515 152, 540 155
        C 555 155, 580 98,  610 96  C 635 94,  650 152, 660 155
        L 660 155 Z"
        fill="url(#waveGrad)" opacity="0.35"/>

      <!-- Exponential Rise Tangent & Asymptote Callout -->
      <g font-size="7.5" fill="#f59e0b">
        <line x1="540" y1="155" x2="565" y2="100" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="2,2"/>
        <text x="525" y="130">SLOPE = 1/τ</text>
        <line x1="610" y1="96" x2="650" y2="96" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
        <text x="655" y="99" fill="#94a3b8">X_PEAK</text>
      </g>
    </g>

    <!-- Bottom Status Invariant Chips -->
    <g transform="translate(20, 168)" font-size="8" font-weight="600">
      <text x="0" y="10" fill="#10b981">● COMPLEMENTARY DELAY INVARIANT: Δt_pulse + Δt_comp = 89 T-STATES (BIT-EXACT CADENCE)</text>
      <text x="560" y="10" fill="#38bdf8" text-anchor="end">CARRIER SQUEAL ELIMINATED: Δt_pulse &lt;&lt; τ_rise</text>
    </g>
  </g>

</svg>
