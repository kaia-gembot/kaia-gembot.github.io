<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="fieldGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0e1a30"/>
      <stop offset="60%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <!-- Cytoplasm Gradient -->
    <radialGradient id="cytoGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#142c4c" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0d1e36" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#081324" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Chromatophore Glow & Gradients -->
    <linearGradient id="chromaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="chromaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Nucleus Gradient -->
    <radialGradient id="nucGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>

    <!-- Siliceous Scale Gradient -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters for Bioluminescent Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="800" fill="url(#fieldGrad)"/>

  <!-- Optical Field Reticle & Technical Watermarks -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <circle cx="400" cy="400" r="375" fill="none" stroke-dasharray="3 6"/>
    <circle cx="400" cy="400" r="340" fill="none" stroke="#0f172a"/>
    <circle cx="400" cy="400" r="230" fill="none" stroke="#0f172a" stroke-dasharray="2 4"/>

    <!-- Crosshair Ticks -->
    <line x1="25" y1="400" x2="55" y2="400"/>
    <line x1="745" y1="400" x2="775" y2="400"/>
    <line x1="400" y1="25" x2="400" y2="55"/>
    <line x1="400" y1="745" x2="400" y2="775"/>
  </g>

  <!-- Header Technical Diagnostics -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="0.06em">
    <text x="35" y="45">MAG: 2400X / NOMARSKI DIC</text>
    <text x="35" y="60">SAMPLE: NAGS HEAD MARSH (NC)</text>
    <text x="35" y="75">TAXON: PAULINELLA CHROMATOPHORA</text>
    
    <text x="765" y="45" text-anchor="end">EVENT: PRIMARY ENDOSYMBIOSIS</text>
    <text x="765" y="60" text-anchor="end">ORIGIN: ~110 MYA (CRETACEOUS)</text>
    <text x="765" y="75" text-anchor="end">PLASTID GENOME: 1.02 Mb (867 CDS)</text>
  </g>

  <!-- Scale Bar (10 um) at Bottom Left -->
  <g transform="translate(35, 750)" stroke="#94a3b8" stroke-width="1.5">
    <line x1="0" y1="0" x2="90" y2="0"/>
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="45" y1="-3" x2="45" y2="3"/>
    <line x1="90" y1="-5" x2="90" y2="5"/>
    <text x="45" y="-9" font-family="ui-monospace, monospace" font-size="10" fill="#cbd5e1" text-anchor="middle" stroke="none">10 µm</text>
  </g>

  <!-- ================= CELLULAR BODY ================= -->
  <!-- Centered exactly at x=400, y=415 with max width 310 (x=245 to 555) -->
  <g id="cellBody" transform="translate(0, 0)">
    
    <!-- Cytoplasmic Silhouette -->
    <path d="M 400 175
             C 475 175, 540 230, 550 330
             C 560 430, 525 535, 450 615
             C 430 635, 415 650, 412 655
             L 388 655
             C 385 650, 370 635, 350 615
             C 275 535, 240 430, 250 330
             C 260 230, 325 175, 400 175 Z"
          fill="url(#cytoGrad)"
          stroke="#0284c7"
          stroke-width="1.5"
          stroke-opacity="0.6"/>

    <!-- Cytosolic Organelles & Granules -->
    <g opacity="0.3" fill="#38bdf8">
      <circle cx="350" cy="270" r="3.5"/>
      <circle cx="445" cy="255" r="3"/>
      <circle cx="465" cy="290" r="4"/>
      <circle cx="330" cy="355" r="3"/>
      <circle cx="468" cy="505" r="3.5"/>
      <circle cx="340" cy="525" r="3"/>
      <circle cx="408" cy="575" r="4"/>
    </g>

    <!-- Vacuoles -->
    <ellipse cx="435" cy="265" rx="30" ry="20" fill="#0c2038" stroke="#1e3a5f" stroke-width="1" opacity="0.7"/>
    <ellipse cx="365" cy="535" rx="24" ry="18" fill="#0c2038" stroke="#1e3a5f" stroke-width="1" opacity="0.7"/>

    <!-- ================= HOST NUCLEUS ================= -->
    <g transform="translate(400, 285)">
      <circle cx="0" cy="0" r="50" fill="#4f46e5" opacity="0.2" filter="url(#glowBlue)"/>
      <circle cx="0" cy="0" r="42" fill="url(#nucGrad)" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="6 2"/>
      
      <!-- Chromatin Dense Strands -->
      <path d="M -20 -12 Q -10 -25, 8 -18 Q 22 -8, 16 10 Q 8 22, -10 18 Q -24 8, -20 -12 Z"
            fill="none" stroke="#e0e7ff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
      <path d="M -8 -4 Q 4 -10, 14 0 Q 18 12, 0 14 Q -12 12, -8 -4 Z"
            fill="#312e81" stroke="#c7d2fe" stroke-width="1.2" opacity="0.85"/>
      <!-- Nucleolus -->
      <circle cx="-3" cy="3" r="9" fill="#1e1b4b" stroke="#e0e7ff" stroke-width="1"/>

      <!-- Nuclear Pores -->
      <circle cx="-42" cy="0" r="1.8" fill="#c7d2fe"/>
      <circle cx="42" cy="0" r="1.8" fill="#c7d2fe"/>
      <circle cx="0" cy="-42" r="1.8" fill="#c7d2fe"/>
      <circle cx="0" cy="42" r="1.8" fill="#c7d2fe"/>
      <circle cx="-29" cy="-29" r="1.8" fill="#c7d2fe"/>
      <circle cx="29" cy="-29" r="1.8" fill="#c7d2fe"/>
      <circle cx="-29" cy="29" r="1.8" fill="#c7d2fe"/>
      <circle cx="29" cy="29" r="1.8" fill="#c7d2fe"/>
    </g>

    <!-- ================= ENDOSYMBIOTIC TRANSIT PATHWAYS ================= -->
    <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity="0.75" filter="url(#subtleGlow)">
      <path d="M 372 312 C 340 350, 325 390, 332 430"/>
      <path d="M 428 312 C 460 350, 475 390, 468 430"/>
    </g>
    <!-- Transport Vesicles with Transit Peptides -->
    <circle cx="346" cy="365" r="4" fill="#38bdf8" filter="url(#glowBlue)"/>
    <circle cx="338" cy="395" r="3" fill="#38bdf8"/>
    <circle cx="454" cy="365" r="4" fill="#38bdf8" filter="url(#glowBlue)"/>
    <circle cx="462" cy="395" r="3" fill="#38bdf8"/>

    <!-- ================= LEFT CHROMATOPHORE ================= -->
    <g filter="url(#glowGreen)">
      <!-- Outer Membrane -->
      <path d="M 358 355
               C 285 375, 278 470, 305 530
               C 328 572, 368 592, 380 582
               C 390 572, 375 545, 356 522
               C 334 490, 330 435, 375 380
               C 388 365, 380 350, 358 355 Z"
            fill="url(#chromaGrad1)"
            stroke="#10b981"
            stroke-width="1.8"/>

      <!-- Peptidoglycan Wall (Retained Cyanobacterial Wall Invariant) -->
      <path d="M 360 360
               C 290 380, 284 470, 310 527
               C 330 567, 366 586, 376 578
               C 384 570, 371 546, 354 524
               C 334 493, 333 437, 373 385
               C 384 371, 377 358, 360 360 Z"
            fill="none"
            stroke="#f59e0b"
            stroke-width="1.2"
            stroke-dasharray="2 3"
            opacity="0.9"/>

      <!-- Thylakoid Concentric Stacks -->
      <g stroke="#34d399" stroke-width="1.2" fill="none" opacity="0.65">
        <path d="M 350 375 C 300 405, 296 470, 318 518 C 336 550, 358 565, 368 565"/>
        <path d="M 354 390 C 312 418, 310 465, 327 506 C 340 532, 356 546, 362 550"/>
        <path d="M 358 405 C 326 428, 324 460, 336 494 C 344 515, 354 528, 359 535"/>
      </g>

      <!-- Carboxysomes (RuBisCO Microcompartments) -->
      <g fill="#a7f3d0" stroke="#047857" stroke-width="0.8">
        <polygon points="320,442 325,438 331,440 332,447 327,451 321,449"/>
        <polygon points="334,462 339,458 345,460 346,467 341,471 335,469"/>
        <polygon points="316,478 321,474 327,476 328,483 323,487 317,485"/>
        <polygon points="332,500 337,496 343,498 344,505 339,509 333,507"/>
        <polygon points="346,522 351,518 357,520 358,527 353,531 347,529"/>
      </g>

      <!-- Circular DNA Nucleoid -->
      <path d="M 338 412 Q 328 425, 342 430 T 350 417 Z" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="1.5 2"/>
    </g>

    <!-- ================= RIGHT CHROMATOPHORE ================= -->
    <g filter="url(#glowGreen)">
      <!-- Outer Membrane -->
      <path d="M 442 355
               C 515 375, 522 470, 495 530
               C 472 572, 432 592, 420 582
               C 410 572, 425 545, 444 522
               C 466 490, 470 435, 425 380
               C 412 365, 420 350, 442 355 Z"
            fill="url(#chromaGrad2)"
            stroke="#10b981"
            stroke-width="1.8"/>

      <!-- Peptidoglycan Wall -->
      <path d="M 440 360
               C 510 380, 516 470, 490 527
               C 470 567, 434 586, 424 578
               C 416 570, 429 546, 446 524
               C 466 493, 467 437, 427 385
               C 416 371, 423 358, 440 360 Z"
            fill="none"
            stroke="#f59e0b"
            stroke-width="1.2"
            stroke-dasharray="2 3"
            opacity="0.9"/>

      <!-- Thylakoid Concentric Stacks -->
      <g stroke="#6ee7b7" stroke-width="1.2" fill="none" opacity="0.65">
        <path d="M 450 375 C 500 405, 504 470, 482 518 C 464 550, 442 565, 432 565"/>
        <path d="M 446 390 C 488 418, 490 465, 473 506 C 460 532, 444 546, 438 550"/>
        <path d="M 442 405 C 474 428, 476 460, 464 494 C 456 515, 446 528, 441 535"/>
      </g>

      <!-- Carboxysomes -->
      <g fill="#a7f3d0" stroke="#047857" stroke-width="0.8">
        <polygon points="480,442 475,438 469,440 468,447 473,451 479,449"/>
        <polygon points="466,462 461,458 455,460 454,467 459,471 465,469"/>
        <polygon points="484,478 479,474 473,476 472,483 477,487 483,485"/>
        <polygon points="468,500 463,496 457,498 456,505 461,509 467,507"/>
        <polygon points="454,522 449,518 443,520 442,527 447,531 453,529"/>
      </g>

      <!-- Circular DNA Nucleoid -->
      <path d="M 462 412 Q 472 425, 458 430 T 450 417 Z" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="1.5 2"/>
    </g>

    <!-- ================= THECA SCALES (SILICA TEST OVERLAY) ================= -->
    <g id="silicaScales" stroke="#38bdf8" stroke-width="0.75">
      <!-- Apex Scales -->
      <ellipse cx="400" cy="184" rx="26" ry="12" fill="url(#scaleGrad)"/>
      <ellipse cx="374" cy="194" rx="25" ry="12" fill="url(#scaleGrad)"/>
      <ellipse cx="426" cy="194" rx="25" ry="12" fill="url(#scaleGrad)"/>
      <ellipse cx="348" cy="210" rx="26" ry="12" transform="rotate(-15 348 210)" fill="url(#scaleGrad)"/>
      <ellipse cx="452" cy="210" rx="26" ry="12" transform="rotate(15 452 210)" fill="url(#scaleGrad)"/>
      <ellipse cx="400" cy="214" rx="30" ry="13" fill="url(#scaleGrad)"/>

      <!-- Lateral & Equatorial Helical Scales -->
      <!-- Left Flank -->
      <ellipse cx="308" cy="245" rx="30" ry="14" transform="rotate(-25 308 245)" fill="url(#scaleGrad)"/>
      <ellipse cx="278" cy="292" rx="31" ry="14" transform="rotate(-35 278 292)" fill="url(#scaleGrad)"/>
      <ellipse cx="260" cy="350" rx="32" ry="15" transform="rotate(-40 260 350)" fill="url(#scaleGrad)"/>
      <ellipse cx="256" cy="415" rx="32" ry="15" transform="rotate(-45 256 415)" fill="url(#scaleGrad)"/>
      <ellipse cx="268" cy="480" rx="32" ry="15" transform="rotate(-35 268 480)" fill="url(#scaleGrad)"/>
      <ellipse cx="292" cy="540" rx="31" ry="14" transform="rotate(-20 292 540)" fill="url(#scaleGrad)"/>
      <ellipse cx="328" cy="590" rx="28" ry="13" transform="rotate(-10 328 590)" fill="url(#scaleGrad)"/>

      <!-- Right Flank -->
      <ellipse cx="492" cy="245" rx="30" ry="14" transform="rotate(25 492 245)" fill="url(#scaleGrad)"/>
      <ellipse cx="522" cy="292" rx="31" ry="14" transform="rotate(35 522 292)" fill="url(#scaleGrad)"/>
      <ellipse cx="540" cy="350" rx="32" ry="15" transform="rotate(40 540 350)" fill="url(#scaleGrad)"/>
      <ellipse cx="544" cy="415" rx="32" ry="15" transform="rotate(45 544 415)" fill="url(#scaleGrad)"/>
      <ellipse cx="532" cy="480" rx="32" ry="15" transform="rotate(35 532 480)" fill="url(#scaleGrad)"/>
      <ellipse cx="508" cy="540" rx="31" ry="14" transform="rotate(20 508 540)" fill="url(#scaleGrad)"/>
      <ellipse cx="472" cy="590" rx="28" ry="13" transform="rotate(10 472 590)" fill="url(#scaleGrad)"/>

      <!-- Central Overlapping Plates -->
      <ellipse cx="365" cy="250" rx="28" ry="13" transform="rotate(-10 365 250)" fill="url(#scaleGrad)"/>
      <ellipse cx="435" cy="250" rx="28" ry="13" transform="rotate(10 435 250)" fill="url(#scaleGrad)"/>
      <ellipse cx="400" cy="272" rx="30" ry="14" fill="url(#scaleGrad)"/>

      <ellipse cx="330" cy="318" rx="29" ry="14" transform="rotate(-15 330 318)" fill="url(#scaleGrad)"/>
      <ellipse cx="470" cy="318" rx="29" ry="14" transform="rotate(15 470 318)" fill="url(#scaleGrad)"/>

      <ellipse cx="300" cy="385" rx="30" ry="14" transform="rotate(-20 300 385)" fill="url(#scaleGrad)"/>
      <ellipse cx="500" cy="385" rx="30" ry="14" transform="rotate(20 500 385)" fill="url(#scaleGrad)"/>

      <ellipse cx="310" cy="445" rx="30" ry="14" transform="rotate(-15 310 445)" fill="url(#scaleGrad)"/>
      <ellipse cx="490" cy="445" rx="30" ry="14" transform="rotate(15 490 445)" fill="url(#scaleGrad)"/>

      <ellipse cx="340" cy="505" rx="29" ry="14" transform="rotate(-10 340 505)" fill="url(#scaleGrad)"/>
      <ellipse cx="460" cy="505" rx="29" ry="14" transform="rotate(10 460 505)" fill="url(#scaleGrad)"/>

      <ellipse cx="370" cy="560" rx="26" ry="13" transform="rotate(-5 370 560)" fill="url(#scaleGrad)"/>
      <ellipse cx="430" cy="560" rx="26" ry="13" transform="rotate(5 430 560)" fill="url(#scaleGrad)"/>

      <!-- Pseudostome Scales -->
      <ellipse cx="375" cy="620" rx="22" ry="10" transform="rotate(10 375 620)" fill="url(#scaleGrad)"/>
      <ellipse cx="425" cy="620" rx="22" ry="10" transform="rotate(-10 425 620)" fill="url(#scaleGrad)"/>
      <ellipse cx="392" cy="645" rx="18" ry="9" fill="url(#scaleGrad)"/>
      <ellipse cx="408" cy="645" rx="18" ry="9" fill="url(#scaleGrad)"/>
    </g>

    <!-- Pseudostome (Mouth Aperture) & Filopodia -->
    <g transform="translate(400, 655)">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Branching Filopodia -->
      <g stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65">
        <path d="M -8 4 C -22 25, -35 50, -65 70 M -35 50 C -48 70, -75 90, -98 95"/>
        <path d="M -3 5 C -8 30, -4 65, -12 95 M -6 50 C -1 75, 4 105, 0 120"/>
        <path d="M 5 5 C 12 30, 25 60, 44 85 M 25 60 C 38 85, 65 105, 84 110"/>
        <path d="M 10 4 C 25 25, 50 45, 78 60"/>
      </g>
    </g>
  </g>

  <!-- ================= UNCLUTTERED ANNOTATION LAYER ================= -->
  <!-- Strictly confined to x < 235 (left) and x > 565 (right) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
    
    <!-- LEFT CALLOUT 1: SILICEOUS THECA (y=210) -->
    <g transform="translate(35, 215)">
      <text x="0" y="0" fill="#e0f2fe" font-weight="bold">SILICEOUS THECA</text>
      <text x="0" y="14" fill="#64748b">Golgi-secreted silica scales</text>
      <text x="0" y="26" fill="#64748b">Chiral spiral imbrication</text>
      <polyline points="150,8 190,8 245,35" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>
      <circle cx="245" cy="35" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- LEFT CALLOUT 2: PEPTIDOGLYCAN WALL (y=475) -->
    <g transform="translate(35, 480)">
      <text x="0" y="0" fill="#fef3c7" font-weight="bold">PEPTIDOGLYCAN WALL</text>
      <text x="0" y="14" fill="#64748b">Retained bacterial wall layer</text>
      <text x="0" y="26" fill="#64748b">Absent in plant chloroplasts</text>
      <polyline points="150,8 195,8 262,45" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.7"/>
      <circle cx="262" cy="45" r="2.5" fill="#f59e0b"/>
    </g>

    <!-- RIGHT CALLOUT 1: HOST NUCLEUS (y=245) -->
    <g transform="translate(765, 250)" text-anchor="end">
      <text x="0" y="0" fill="#e0e7ff" font-weight="bold">HOST NUCLEUS</text>
      <text x="0" y="14" fill="#64748b">Rhizarian genome (Thecofilosea)</text>
      <text x="0" y="26" fill="#64748b">Encodes ~860 plastid proteins</text>
      <polyline points="-180,8 -230,8 -320,35" stroke="#818cf8" stroke-width="1" fill="none" opacity="0.6"/>
      <circle cx="-320" cy="35" r="2.5" fill="#818cf8"/>
    </g>

    <!-- RIGHT CALLOUT 2: CHROMATOPHORE (y=475) -->
    <g transform="translate(765, 480)" text-anchor="end">
      <text x="0" y="0" fill="#a7f3d0" font-weight="bold">CHROMATOPHORE (x2)</text>
      <text x="0" y="14" fill="#64748b">α-cyanobacterial endosymbiont</text>
      <text x="0" y="26" fill="#64748b">Concentric thylakoids &amp; RuBisCO</text>
      <polyline points="-180,8 -215,8 -275,30" stroke="#10b981" stroke-width="1" fill="none" opacity="0.7"/>
      <circle cx="-275" cy="30" r="2.5" fill="#10b981"/>
    </g>

    <!-- RIGHT CALLOUT 3: PSEUDOSTOME (y=665) -->
    <g transform="translate(765, 665)" text-anchor="end">
      <text x="0" y="0" fill="#bae6fd" font-weight="bold">PSEUDOSTOME</text>
      <text x="0" y="14" fill="#64748b">Aperture with radiating filopodia</text>
      <polyline points="-180,8 -230,8 -340,-10" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>
      <circle cx="-340" cy="-10" r="2.5" fill="#38bdf8"/>
    </g>
  </g>
</svg>
